[package]
name = "coordination-desktop"
version = "0.1.0"
description = "ALTO native coordination workspace"
authors = ["ALTO contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coordination_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-global-shortcut = "=2.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

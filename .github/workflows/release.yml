name: Native release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-artifact:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            platform: windows
            architecture: x64
            host_architecture: AMD64
            artifact_name: coordination-engine-windows-x64
            signing: unsigned
            notarization: not-applicable
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: macos
            architecture: arm64
            host_architecture: arm64
            artifact_name: coordination-engine-macos-arm64
            signing: ad-hoc
            notarization: not-notarized
          - name: macOS Intel DMG
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            platform: macos
            architecture: x64
            host_architecture: x86_64
            artifact_name: coordination-engine-macos-x64
            signing: ad-hoc
            notarization: not-notarized
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Verify Windows native host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.host_architecture }}') {
            throw "Expected ${{ matrix.host_architecture }} host, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Verify macOS native host
        if: runner.os == 'macOS'
        shell: bash
        run: |
          actual="$(uname -m)"
          test "$actual" = '${{ matrix.host_architecture }}' || {
            echo "Expected ${{ matrix.host_architecture }} host, got $actual" >&2
            exit 1
          }

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build native bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '13.0' || '' }}
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_DEFAULT_COMPANY_ID: ${{ vars.VITE_DEFAULT_COMPANY_ID }}
        run: npm --workspace @coordination/desktop run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage Windows distributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = 'artifacts/release/${{ matrix.artifact_name }}'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path 'apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe' -Destination $destination

      - name: Stage macOS distributable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          destination='artifacts/release/${{ matrix.artifact_name }}'
          mkdir -p "$destination"
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$destination/"

      - name: Generate and verify release manifest
        shell: bash
        run: |
          directory='artifacts/release/${{ matrix.artifact_name }}'
          node scripts/release-manifest.mjs \
            --input "$directory" \
            --output "$directory/release-manifest.json" \
            --platform '${{ matrix.platform }}' \
            --arch '${{ matrix.architecture }}' \
            --target '${{ matrix.target }}' \
            --signing '${{ matrix.signing }}' \
            --notarization '${{ matrix.notarization }}'
          node scripts/verify-release.mjs "$directory/release-manifest.json"

      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/release/${{ matrix.artifact_name }}/
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

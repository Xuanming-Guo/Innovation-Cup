name: Feature request
description: Propose a scoped product capability or meaningful enhancement.
title: "feat: "
labels:
  - "type: feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user, current workflow and outcome that needs improvement.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behaviour without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Proposed priority
      options:
        - P0 human workflow
        - P1 extension
        - Deferred or exploratory
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority, privacy and data boundaries
      description: Identify permissions, disclosures, external writes, employee effects and sensitive data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable outcomes, failure behaviour and evidence required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and dependencies
      description: Note simpler approaches, prerequisites and open decisions.

name: coordination-engine-host

x-backend-common: &backend-common
  platform: linux/amd64
  build:
    context: ../../services/backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &backend-environment
    COORDINATION_ENVIRONMENT: production
    COORDINATION_API_VERSION: 1.0.0
    COORDINATION_BUILD_COMMIT: ${COORDINATION_BUILD_COMMIT:?run the host launcher}
    COORDINATION_SUPABASE_URL: ${COORDINATION_SUPABASE_URL:?set in deploy/local-host/.env}
    COORDINATION_SUPABASE_JWT_ISSUER: ${COORDINATION_SUPABASE_URL:?set in deploy/local-host/.env}/auth/v1
    COORDINATION_INTERPRETATION_MODE: gemini
    COORDINATION_GEMINI_MODEL: ${COORDINATION_GEMINI_MODEL:-gemini-3.8-flash}
    COORDINATION_GEMINI_TIMEOUT_SECONDS: ${COORDINATION_GEMINI_TIMEOUT_SECONDS:-60}
    COORDINATION_VERTEX_LOCATION: ${COORDINATION_VERTEX_LOCATION:-global}
    COORDINATION_VERTEX_ALLOWED_PROJECT_IDS: ${COORDINATION_VERTEX_ALLOWED_PROJECT_IDS:-}

services:
  api:
    <<: *backend-common
    environment:
      <<: *backend-environment
      COORDINATION_DATABASE_URL: ${COORDINATION_API_DATABASE_URL:?set the API-role DSN}
    ports:
      - "127.0.0.1:8000:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["python", "-m", "coordination.worker.main"]
    environment:
      <<: *backend-environment
      COORDINATION_DATABASE_URL: ${COORDINATION_WORKER_DATABASE_URL:?set the worker-role DSN}
      COORDINATION_WORKER_INSTANCE_NAME: laptop-host-worker
    healthcheck:
      test: ["CMD", "python", "-m", "coordination.worker.main", "--status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    platform: linux/amd64
    user: "0:0"
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --logfile
      - /state/cloudflared.log
      - --url
      - http://api:8080
    volumes:
      - tunnel-state:/state
    depends_on:
      api:
        condition: service_healthy

  registrar:
    <<: *backend-common
    command: ["python", "-m", "coordination.hosting.registrar"]
    environment:
      <<: *backend-environment
      COORDINATION_DATABASE_URL: ${COORDINATION_API_DATABASE_URL:?set the API-role DSN}
      COORDINATION_HOST_COMPANY_ID: ${COORDINATION_HOST_COMPANY_ID:?set the company UUID}
      COORDINATION_HOST_ACTOR_ID: ${COORDINATION_HOST_ACTOR_ID:?set the company-admin Auth UUID}
      COORDINATION_HOST_INSTANCE_ID: ${COORDINATION_HOST_INSTANCE_ID:?run the host launcher}
      COORDINATION_HOST_TUNNEL_LOG_PATH: /state/cloudflared.log
      COORDINATION_HOST_READY_PATH: /tmp/coordination-host-registrar.ready
      COORDINATION_HOST_HEARTBEAT_SECONDS: 30
      COORDINATION_HOST_TTL_SECONDS: 120
    volumes:
      - tunnel-state:/state:ro
    depends_on:
      api:
        condition: service_healthy
      tunnel:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "coordination.hosting.registrar", "--probe"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  tunnel-state:

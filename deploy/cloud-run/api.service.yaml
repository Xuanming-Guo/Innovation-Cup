apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: coordination-api
  annotations:
    run.googleapis.com/description: Coordination Engine authenticated API
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      serviceAccountName: coordination-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/coordination/backend:COMMIT_SHA
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: COORDINATION_ENVIRONMENT
              value: production
            - name: COORDINATION_BUILD_COMMIT
              value: COMMIT_SHA
            - name: COORDINATION_SUPABASE_URL
              value: SUPABASE_PROJECT_URL
            - name: COORDINATION_SUPABASE_JWT_ISSUER
              value: SUPABASE_JWT_ISSUER
            - name: COORDINATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coordination-api-database-url
                  key: latest
          startupProbe:
            httpGet:
              path: /health/ready
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
            periodSeconds: 30
